window.__setQ=q=>{quality=q;resize()};const qlbl=()=>{$('qual').textContent='GFX: '+quality;$('snd').textContent='SOUND: '+(soundOn?'ON':'OFF');$('mus').textContent='MUSIC: '+(musicOn?'ON':'OFF')};qlbl();
$('qual').onclick=()=>{quality=quality==='HIGH'?'LOW':'HIGH';localStorage.ngpQ=quality;resize();qlbl()};
$('snd').onclick=()=>{soundOn=!soundOn;localStorage.ngpS=soundOn?1:0;if(sfxGain)sfxGain.gain.value=soundOn?.6:0;qlbl()};
$('mus').onclick=()=>{musicOn=!musicOn;localStorage.ngpM=musicOn?1:0;if(musGain)musGain.gain.value=musicOn?.22:0;qlbl()};
addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(state==='title')$('play').click();else if(state==='garage')$('gok').click();else if(state==='courses')startRace();else if(state==='results')startRace()});
addEventListener('keydown',e=>{if(state==='garage'){if(e.key==='ArrowLeft')$('prev').click();if(e.key==='ArrowRight')$('next').click()}if(state==='courses'){if(e.key==='ArrowLeft'||e.key==='ArrowRight'){pickCourse((course+(e.key==='ArrowRight'?1:5))%6)}}});
// garage scene
const gLights=[new THREE.HemisphereLight(0xaa88ff,0x110022,.6),new THREE.DirectionalLight(0xffffff,2.2),new THREE.PointLight(0xff2bd6,12,30),new THREE.PointLight(0x00f0ff,12,30)];gLights[1].position.set(5,10,6);gLights[2].position.set(-6,3,-4);gLights[3].position.set(6,3,4);gLights.forEach(l=>gscene.add(l));
gscene.add(new THREE.Mesh(new THREE.SphereGeometry(400,32,16),new THREE.MeshBasicMaterial({map:skyTex(COURSES[0].th),color:0x777777,side:THREE.BackSide})));
const turn=new THREE.Group();gscene.add(turn);const plat=new THREE.Mesh(new THREE.CylinderGeometry(5,5.4,.4,48),new THREE.MeshStandardMaterial({color:0x1a1030,metalness:.9,roughness:.25}));plat.position.y=-.2;gscene.add(plat);
const pring=new THREE.Mesh(new THREE.TorusGeometry(5.2,.06,6,64),new THREE.MeshBasicMaterial({color:new THREE.Color(0x00f0ff).multiplyScalar(2)}));pring.rotation.x=Math.PI/2;gscene.add(pring);
let gCar=null;const gcache={};
function garageShow(){if(gCar)turn.remove(gCar);gCar=gcache[player]||(gcache[player]=buildCar(CARS[player]));turn.add(gCar);const sp=CARS[player];$('cname').textContent='#'+sp.num+' '+sp.n;$('cteam').textContent=sp.team;
 $('cstats').innerHTML=[['SPEED',sp.spd],['ACCEL',sp.acc],['HANDLING',sp.hnd],['BOOST',sp.bst]].map(([k,v])=>`<div class="stat"><b>${k}</b><div class="bar"><i style="width:${v*10}%"></i></div></div>`).join('');pring.material.color.set(sp.c2).multiplyScalar(2)}
function renderCourses(){$('clist').innerHTML=COURSES.map((c,i)=>`<div class="card ${i===course?'sel':''}" data-i="${i}" style="border-color:${i===course?'':'#'+new THREE.Color(c.th.ea).getHexString()+'88'}">${i+1}. ${c.n}<small>${c.d}</small></div>`).join('');
 [...$('clist').children].forEach(el=>el.onclick=()=>pickCourse(+el.dataset.i))}
function pickCourse(i){if(i!==course)loadCourse(i);renderCourses()}
// ---------- render ----------
const tmpM=new THREE.Matrix4(),camPos=new V3(),camLook=new V3(),camUp=new V3(0,1,0);let fov=70,t0=0,lastT=performance.now();
function render(dt){t0+=dt;let sc=scene;
 if(state==='garage'){sc=gscene;turn.rotation.y+=dt*.5;const portrait=innerHeight>innerWidth;cam.position.set(Math.sin(t0*.15)*2,4,portrait?14:10);cam.up.set(0,1,0);cam.lookAt(0,portrait?-1:-3.2,0);cam.fov=55;cam.updateProjectionMatrix()}
 else{
 for(const c of cars){const f=frame(c.s);const hover=.55+Math.sin(t0*6+c.s)*.1;const pos=f.p.clone().addScaledVector(f.r,c.x).addScaledVector(f.u,hover+c.fy);c.mesh.position.copy(pos);
  const fwd=f.t.clone().applyAxisAngle(f.u,c.yaw*.8),right=new V3().crossVectors(fwd,f.u).normalize();tmpM.makeBasis(right,f.u,fwd.clone().negate());c.mesh.quaternion.setFromRotationMatrix(tmpM);c.mesh.rotateZ(-c.yaw*.4);if(c.air)c.mesh.rotateX(.08);if(c.fall)c.mesh.rotateX(c.fall*2);
  c.mesh.visible=!(c.respawn>0&&Math.floor(t0*12)%2);const fl=c.mesh.userData.flame;fl.scale.set(1,.4+c.v/90+(c.boost>0?1.6:0),1);fl.visible=c.v>1}
 if(state==='title'||state==='courses'){const a=t0*.12,cn=COURSES[course];cam.position.set(Math.cos(a)*cn.R*1.6,320,Math.sin(a)*cn.R*1.6);cam.up.set(0,1,0);cam.lookAt(0,0,0);cam.fov=60;cam.updateProjectionMatrix();camPos.copy(cam.position)}
 else if(cars.length){const me=cars[0],f=frame(me.s);const back=f.p.clone().addScaledVector(f.r,me.x*.85).addScaledVector(f.t,cam.aspect<1?-13:-10).addScaledVector(f.u,(cam.aspect<1?5:3.8)+me.fy*.6);
  camPos.lerp(back,Math.min(1,dt*9));if(camPos.distanceTo(back)>60)camPos.copy(back);cam.position.copy(camPos);camUp.lerp(f.u,Math.min(1,dt*6)).normalize();cam.up.copy(camUp);
  camLook.copy(me.mesh.position).addScaledVector(f.t,8).addScaledVector(f.u,1);cam.lookAt(camLook);
  const tf=64+me.v/95*16+(me.boost>0?14:0);fov+=(tf-fov)*dt*4;cam.fov=cam.aspect<1?Math.min(100,fov*1.35):fov;cam.updateProjectionMatrix();
  $('lines').style.opacity=me.boost>0?.9:Math.max(0,(me.v-80)/40);
  if(AC&&engGain){engGain.gain.setTargetAtTime(soundOn&&state!=='paused'&&state!=='results'?.12:0,AC.currentTime,.1);eo1.frequency.setTargetAtTime(55+me.v*1.6+(me.boost>0?40:0),AC.currentTime,.05);eo2.frequency.setTargetAtTime(55+me.v*1.6,AC.currentTime,.05);engF.frequency.setTargetAtTime(400+me.v*25,AC.currentTime,.05)}
  const o=order();$('pos').textContent='P'+(o.indexOf(me)+1)+'/6';$('lap').textContent='LAP '+Math.min(TOTAL,Math.max(1,me.lap+1))+'/'+TOTAL;$('time').textContent=fmt(me.done?me.time:raceT);$('best').textContent='BEST '+fmt(bestLap);
  $('spd').firstChild.textContent=Math.round(me.v*4);$('spd').querySelector('small').textContent=me.drift?'🔥 DRIFT':me.air?'✈ AIR':me.boost>0?'⚡ BOOST':'km/h';$('boostbar').firstChild.style.width=(me.boost/me.st.bDur*100)+'%'}
 if(roadMap){roadMap.offset.y=-t0*.6;roadMap.userData.em.offset.y=-t0*.6}
 for(const a of animated){if(a.spin){a.z?a.spin.rotateZ(dt*a.r):a.spin.rotation.y+=dt*a.r}else if(a.pad){a.pad.color.setHSL(.42+Math.sin(t0*8)*.05,1,.55+Math.sin(t0*10)*.2).multiplyScalar(1.6)}else if(a.holo){a.holo.opacity=Math.random()<.02?.2:.85+Math.sin(t0*3+a.ph)*.15}else if(a.m){const k=1.6+Math.sin(t0*4)*.5;a.m.color.copy(a.c).multiplyScalar(k)}else if(a.face){a.face.parent.quaternion.copy(cam.quaternion)}}
 updParticles(dt)}
 if(quality==='HIGH'){rpass.scene=sc;composer.render()}else R.render(sc,cam)}
function loop(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;if(state==='race'||state==='count'||state==='finish')update(dt);render(dt);requestAnimationFrame(loop)}
loadCourse(0);$('loading').remove();toTitle();requestAnimationFrame(loop);
window.__game={startRace,loadCourse,get cars(){return cars},get state(){return state},garage:()=>$('play').click(),courses:()=>$('gok').click(),pickCourse};
</script></body></html>
