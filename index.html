 if(state==='race'&&cars[0].done){state='finish';setTimeout(showResults,2500);$('msg').textContent=['1ST!','2ND','3RD','4TH','5TH','6TH'][finishOrder.indexOf(cars[0])]}
}
let flash=0;
function fmt(t){const m=Math.floor(t/60),s=t%60;return m+':'+(s<10?'0':'')+s.toFixed(2)}
function order(){return [...cars].sort((a,b)=>{if(a.done&&b.done)return a.time-b.time;if(a.done)return -1;if(b.done)return 1;return progress(b)-progress(a)})}
function showResults(){const o=order();let h='<table>';o.forEach((c,i)=>{h+=`<tr style="color:${c.ai?'#ccc':'#0ff'}"><td>P${i+1}</td><td>${c.name}</td><td>${c.done?fmt(c.time):'+'+(TOTAL-Math.max(0,c.lap))+' lap'}</td></tr>`});h+='</table>';
 $('res').innerHTML=h;$('menu').querySelector('h1').textContent='FINISH';$('sub').textContent='';$('go').textContent='RACE AGAIN';$('menu').classList.remove('hide');$('msg').textContent='';state='menu';cars[0].ai=false}
const tmpM=new THREE.Matrix4(),camPos=new THREE.Vector3(),camLook=new THREE.Vector3();let fov=70,t0=0;
function render(dt){t0+=dt;
 for(const c of cars){const f=frame(c.s);const hover=0.6+Math.sin(t0*6+c.s)*0.12;
  const pos=f.p.clone().addScaledVector(f.r,c.x).addScaledVector(f.u,hover+c.fy);c.mesh.position.copy(pos);
  const fwd=f.t.clone().applyAxisAngle(f.u,c.yaw*0.8);const right=new THREE.Vector3().crossVectors(fwd,f.u).normalize();
  tmpM.makeBasis(right,f.u,fwd.clone().negate());c.mesh.quaternion.setFromRotationMatrix(tmpM);c.mesh.rotateZ(-c.yaw*0.4);if(c.fall)c.mesh.rotateX(c.fall*2);
  const fl=c.mesh.userData.flame;fl.scale.set(1,0.4+c.v/MAXV+(c.boost>0?1.5:0),1);fl.visible=c.v>1}
 const me=cars[0],f=frame(me.s);const back=f.p.clone().addScaledVector(f.r,me.x*0.85).addScaledVector(f.t,-13).addScaledVector(f.u,5+(me.fy*0.3));
 if(state==='menu'&&!$('menu').classList.contains('hide')&&raceT===0){const a=t0*0.2;back.set(Math.cos(a)*700,350,Math.sin(a)*700-350)}
 camPos.lerp(back,Math.min(1,dt*(state==='menu'?1:8)));if(camPos.lengthSq()===0)camPos.copy(back);cam.position.copy(camPos);
 camLook.copy(me.mesh.position).addScaledVector(f.t,8);cam.up.copy(f.u);cam.lookAt(camLook);
 const tf=70+me.v/MAXV*18+(me.boost>0?12:0);fov+=(tf-fov)*dt*4;cam.fov=fov;cam.updateProjectionMatrix();
 $('lines').style.opacity=me.boost>0?0.9:Math.max(0,(me.v-75)/40);
 padMat.color.setHSL(0.42+Math.sin(t0*8)*0.05,1,0.5+Math.sin(t0*10)*0.15);pl1.rotation.y+=dt*0.02;
 const o=order();$('pos').textContent='P'+(o.indexOf(me)+1)+'/6';$('lap').textContent='LAP '+Math.min(TOTAL,Math.max(1,me.lap+1))+'/'+TOTAL;$('time').textContent=fmt(me.done?me.time:raceT);$('spd').textContent=Math.round(me.v*4)+' km/h'+(me.drift?' 🔥DRIFT':'');
 R.render(scene,cam)}
camPos.set(0,0,0);
function loop(now){const dt=Math.min(0.05,(now-lastT)/1000);lastT=now;update(dt);render(dt);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
